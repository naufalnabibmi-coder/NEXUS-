<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - NEXUS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="messages-extra.css">
</head>
<body>
    <canvas id="particles"></canvas>

    <nav>
        <a href="index.html" class="logo">NEXUS</a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="messages.html" class="active">Messages</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </nav>

    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-user">
                <div class="user-avatar" id="userAvatar">U</div>
                <h4 id="sidebarName">User</h4>
                <p id="sidebarEmail">user@email.com</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="projects.html">📁 Projects</a></li>
                <li><a href="messages.html" class="active">💬 Messages</a></li>
                <li><a href="profile.html">👤 Profil</a></li>
                <li><a href="settings.html">⚙️ Settings</a></li>
            </ul>
        </aside>

        <main class="app-main">
            <div class="page-header">
                <h1>Messages</h1>
                <p id="unreadCount">0 pesan belum dibaca</p>
            </div>

            <div class="messages-layout">
                <!-- INBOX -->
                <div class="inbox-panel">
                    <div class="inbox-search">
                        <span>🔍</span>
                        <input type="text" id="inboxSearch" placeholder="Cari pesan...">
                    </div>

                    <div class="inbox-filter">
                        <button class="inbox-filter-btn active" data-filter="all">Semua</button>
                        <button class="inbox-filter-btn" data-filter="unread">Belum dibaca</button>
                    </div>

                    <div class="inbox-list" id="inboxList"></div>
                </div>

                <!-- CHAT -->
                <div class="chat-panel" id="chatPanel">
                    <div class="chat-empty" id="chatEmpty">
                        <div style="font-size:4rem;margin-bottom:1rem">💬</div>
                        <h3>Pilih percakapan</h3>
                        <p>Klik pesan di kiri untuk mulai chat</p>
                    </div>

                    <div class="chat-active" id="chatActive" style="display:none">
                        <!-- HEADER -->
                        <div class="chat-header">
                            <div class="chat-avatar" id="chatAvatar">U</div>
                            <div class="chat-info">
                                <strong id="chatName">User</strong>
                                <span class="chat-status" id="chatStatus">
                                    <span class="status-dot"></span> Online
                                </span>
                            </div>
                            <div class="chat-header-actions">
                                <button class="icon-btn" id="clearChatBtn" title="Hapus semua pesan">🗑</button>
                            </div>
                        </div>

                        <!-- MESSAGES -->
                        <div class="chat-messages" id="chatMessages"></div>

                        <!-- TYPING INDICATOR -->
                        <div class="typing-indicator" id="typingIndicator" style="display:none">
                            <span></span><span></span><span></span>
                        </div>

                        <!-- INPUT -->
                        <form class="chat-input-form" id="chatForm">
                            <button type="button" class="chat-emoji-btn" id="emojiBtn" title="Emoji">
                                😊
                            </button>
                            <input type="text" id="chatInput" placeholder="Ketik pesan..." autocomplete="off" maxlength="500">
                            <button type="submit" class="chat-send-btn" id="sendBtn" title="Kirim">
                                ➤
                            </button>
                        </form>

                        <!-- EMOJI PICKER -->
                        <div class="emoji-picker" id="emojiPicker" style="display:none"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
    <script src="messages.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - NEXUS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles"></canvas>

    <nav>
        <a href="index.html" class="logo">NEXUS</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Daftar</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </nav>

    <section class="register-section">
        <div class="register-container" style="grid-template-columns:1fr;max-width:460px;">
            <div class="register-form-wrapper">
                <div class="form-header">
                    <div style="font-size:2.5rem;margin-bottom:0.8rem">🔑</div>
                    <h2>Lupa Password?</h2>
                    <p>Masukkan email Anda, kami akan kirim link untuk reset password</p>
                </div>

                <form id="forgotForm" novalidate>
                    <div class="form-group">
                        <label for="email">Email Terdaftar</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉</span>
                            <input type="email" id="email" placeholder="nama@email.com" required>
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-submit" id="submitBtn">
                        <span class="btn-text">Kirim Link Reset</span>
                        <span class="btn-loader"></span>
                    </button>
                </form>

                <div style="text-align:center;margin-top:1.5rem">
                    <a href="login.html" style="color:var(--text-dim);font-size:0.9rem;text-decoration:none">
                        ← Kembali ke Login
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div class="modal" id="resetModal">
        <div class="modal-content">
            <div class="modal-icon">📧</div>
            <h2>Email Terkirim!</h2>
            <p>Cek inbox Anda untuk link reset password. Link berlaku 1 jam.</p>
            <a href="login.html" class="btn btn-primary">Kembali ke Login</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        initParticles();
        initThemeToggle();
        initForgotPassword();
    </script>
</body>
</html>
